version: 0.2
run-as: root

env:
  variables:
    REGION_CODE: "ap-northeast-2"

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$REGION_CODE.amazonaws.com/$ECR_NAME
      - aws ecr get-login-password --region $REGION_CODE | docker login --username AWS --password-stdin $ECR_URI
      - LATEST_TAG=$(aws ecr describe-images --repository-name $ECR_NAME --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' --output text 2>/dev/null)
      - |
        if [ "$LATEST_TAG" == "None" ] || [ -z "$LATEST_TAG" ]; then
          IMAGE_TAG="v1.0.0"
        else
          IMAGE_TAG=$(echo $LATEST_TAG | awk -F. -v OFS=. '{$NF=$NF+1; print}')
        fi

  build:
    commands:
      - docker build -t $ECR_URI:$IMAGE_TAG .

  post_build:
    commands:
      - docker push $ECR_URI:$IMAGE_TAG

artifacts:
  files:
    - appspec.yml
    - scripts/*.sh